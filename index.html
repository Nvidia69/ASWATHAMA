<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASWATHAMA // CEO</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        /* ========================================================================
           CORE VARIABLES & ASSETS
           ======================================================================== */
        :root {
            --primary-neon: #00f7ff; /* Cyan Blue */
            --secondary-neon: #bc13fe; /* Purple */
            --bg-dark: #050505;
            --glass-panel: rgba(10, 15, 20, 0.75);
            --border-color: rgba(145, 255, 0, 0.3);
        }

        /* ========================================================================
           GLOBAL STYLES
           ======================================================================== */
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }

        body {
            background-color: var(--bg-dark);
            /* Added a subtle grid texture for background depth */
            background-image: linear-gradient(rgba(0, 247, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 247, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--primary-neon);
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        #neural-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        
        /* CRT Scanline Effect - Iska z-index 999 hai */
        body::after {
            content: ""; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.15) 1px, transparent 1px, transparent 2px);
            pointer-events: none; z-index: 999;
        }

        /* ========================================================================
           OVERLAY (CLICK TO START)
           ======================================================================== */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark); z-index: 10000;
            display: flex; justify-content: center; align-items: center;
            flex-direction: column; cursor: pointer; transition: opacity 0.8s ease;
        }
        #overlay .enter-text {
            font-family: 'Share Tech Mono', monospace; color: var(--primary-neon);
            font-size: 20px; letter-spacing: 5px; text-transform: uppercase;
            border: 1px solid var(--primary-neon); padding: 15px 30px;
            box-shadow: 0 0 15px var(--primary-neon);
            animation: pulse-border 1.5s infinite alternate;
        }
        @keyframes pulse-border { from { box-shadow: 0 0 5px var(--primary-neon); } to { box-shadow: 0 0 20px var(--primary-neon), inset 0 0 10px var(--primary-neon); } }

        /* ========================================================================
           CUSTOM CURSOR
           ======================================================================== */
        .cursor-dot, .cursor-circle { position: fixed; top: 0; left: 0; transform: translate(-50%, -50%); border-radius: 50%; z-index: 9999; pointer-events: none; }
        .cursor-dot { width: 5px; height: 5px; background: var(--primary-neon); }
        .cursor-circle { width: 30px; height: 30px; border: 1px solid var(--primary-neon); transition: width 0.2s, height 0.2s, top 0.1s, left 0.1s; }

        /* ========================================================================
           MAIN CARD DESIGN
           ======================================================================== */
        .card-container { position: relative; z-index: 10; width: 400px; transform-style: preserve-3d; transition: transform 0.1s ease-out; }
        
        .card {
            background: var(--glass-panel); backdrop-filter: blur(12px);
            border: 1px solid var(--primary-neon);
            box-shadow: 0 0 5px var(--primary-neon), 0 0 15px var(--primary-neon), inset 0 0 10px rgba(0, 243, 255, 0.1);
            padding: 40px; text-align: center;
            clip-path: polygon(0% 0%, 100% 0%, 100% 90%, 92% 100%, 0% 100%);
        }
        
        .card::before { content: "ASWATHAMA"; position: absolute; top: 10px; right: 15px; font-size: 10px; opacity: 0.6; letter-spacing: 2px; }

        .profile-img {
            width: 120px; height: 120px; margin: 0 auto 20px;
            border: 2px solid var(--primary-neon); object-fit: cover;
            filter: grayscale(100%) contrast(1.2); transition: 0.5s;
        }
        .card:hover .profile-img { filter: grayscale(0%) contrast(1); }

        h1.glitch { font-size: 28px; position: relative; color: #fff; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 5px; }
        h1.glitch::before, h1.glitch::after { content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); }
        h1.glitch::before { left: 2px; text-shadow: -1px 0 var(--secondary-neon); clip: rect(44px, 450px, 56px, 0); animation: glitch-anim 5s infinite linear alternate-reverse; }
        h1.glitch::after { left: -2px; text-shadow: -1px 0 var(--primary-neon); clip: rect(44px, 450px, 56px, 0); animation: glitch-anim-2 5s infinite linear alternate-reverse; }

        .role { font-size: 12px; color: var(--secondary-neon); margin-bottom: 20px; display: block; font-family: 'Fira Code', monospace; }
        
        .tags { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 30px; }
        .tag { font-size: 10px; border: 1px solid var(--primary-neon); padding: 4px 8px; background: rgba(0, 243, 255, 0.05); text-transform: uppercase; transition: 0.3s; }
        .tag:hover { background: var(--primary-neon); color: black; }

        .links-stack { display: flex; flex-direction: column; gap: 12px; }
        .cyber-btn {
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); padding: 14px;
            text-decoration: none; color: var(--primary-neon); font-size: 14px; font-weight: bold;
            display: flex; justify-content: space-between; transition: 0.3s;
            position: relative; overflow: hidden;
        }
        .cyber-btn:hover { background: rgba(0, 243, 255, 0.1); border-color: var(--primary-neon); padding-left: 20px; }
        
        /* Music Player */
        .music-player { margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; display: flex; align-items: center; gap: 10px; font-size: 10px; }
        .equalizer { display: flex; gap: 2px; height: 15px; align-items: flex-end; }
        .bar { width: 3px; background: var(--primary-neon); animation: bounce 1s infinite ease-in-out; animation-play-state: paused; }
        .bar:nth-child(2) { animation-delay: 0.2s; }
        .bar:nth-child(3) { animation-delay: 0.4s; }
        .bar:nth-child(4) { animation-delay: 0.1s; }
        @keyframes bounce { 0%, 100% { height: 2px; } 50% { height: 15px; } }

        /* Animations */
        @keyframes glitch-anim { 0% { clip: rect(38px, 9999px, 81px, 0); } 100% { clip: rect(20px, 9999px, 70px, 0); } }
        @keyframes glitch-anim-2 { 0% { clip: rect(10px, 9999px, 30px, 0); } 100% { clip: rect(50px, 9999px, 90px, 0); } }

        /* ========================================================================
           CATBOX WAIFU (Character Art)
           ======================================================================== */
        #catbox-waifu {
            /* ✨ FIX: z-index increased to 1000 to sit above the scanlines (which are at 999) */
            position: fixed; bottom: 0; right: 0; z-index: 1000; pointer-events: none;
        }
        #catbox-waifu img {
            display: block; max-height: 250px; max-width: 100%;
            filter: drop-shadow(0 0 5px var(--primary-neon));
        }

        /* ========================================================================
           MOBILE RESPONSIVENESS
           ======================================================================== */
        @media (max-width: 600px) {
            .card-container { width: 90%; transform: none !important; }
            body { perspective: none; }
            #catbox-waifu img { max-height: 120px; opacity: 0.6; }
            .cursor-dot, .cursor-circle { display: none; } /* Hide custom cursor on touch */
        }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="enter-text glitch" data-text="[ ENTRAR ]">[ ENTER ]</div>
        <p style="color:rgba(0,243,255,0.4); font-size:10px; margin-top:15px; letter-spacing:2px;">AUTHENTICATING ID: ASWATHAMA</p>
    </div>

    <div class="cursor-dot"></div>
    <div class="cursor-circle"></div>
    <canvas id="neural-canvas"></canvas>

    <div class="card-container" id="tilt-card">
        <div class="card">
            <div class="profile-wrapper">
                <img src="" alt="User Avatar" class="profile-img" id="user-avatar">
            </div>
            <h1 class="glitch" id="user-name" data-text="LOADING...">LOADING...</h1>
            <span class="role" id="user-role">...</span>
            
            <div class="tags" id="tags-box"></div>
            <div class="links-stack" id="links-box"></div>
            
            <div class="music-player">
                <div class="equalizer">
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                </div>
                <div style="text-align: left;">
                    <div style="color:white; font-weight:bold;">NOW PLAYING</div>
                    <div id="track-name" style="opacity:0.7;">System_Idle.mp3</div>
                </div>
                <button id="play-btn" style="margin-left:auto; background:none; border:1px solid var(--primary-neon); color:var(--primary-neon); padding:4px 10px; font-size:10px; font-family: inherit; cursor: pointer;">PLAY</button>
            </div>
            <audio id="audio-source" loop></audio>
        </div>
    </div>

    <div id="catbox-waifu"></div>

    <script>
        /* ========================================================================
           CONFIGURATION CENTER - EDIT HERE
           ======================================================================== */
        const SYSTEM_CONFIG = {
            profile: {
                name: "Indian Government",
                role: "HACKER // DEV // GAMER",
                // Profile Picture (Gif supported)
                avatar: "https://files.catbox.moe/mmi9n8.gif", 
                // Anime Character for bottom right (PNG recommended)
                // Using a generic placeholder. Replace with your Waifu URL!
                waifuImage: "https://files.catbox.moe/54b706.png" 
            },
            tags: ["Python", "Html", "Gamer", "Panel Seller"],
            links: [
                { label: "@ASWATHAMA", url: "https://discord.gg/kCfqbWDFUR" },
                { label: "INSTAGRAM", url: "#" },
                { label: "PANEL SELLER", url: "https://t.me/nvidia61" },
                { label: "TELEGRAM", url: "https://t.me/nvidia61" }
            ],
            music: {
                name: "LOUCURA LETAL",
                // This link must be a direct MP3 link
                url: "https://files.catbox.moe/dky8cn.mp3" 
            }
        };

        /* ========================================================================
           SYSTEM INITIALIZATION
           ======================================================================== */
        // 1. Load Profile Data
        document.getElementById('user-name').innerText = SYSTEM_CONFIG.profile.name;
        document.getElementById('user-name').setAttribute('data-text', SYSTEM_CONFIG.profile.name);
        document.getElementById('user-role').innerText = `> ${SYSTEM_CONFIG.profile.role}`;
        document.getElementById('user-avatar').src = SYSTEM_CONFIG.profile.avatar;
        
        // 2. Load Waifu Image
        const waifuContainer = document.getElementById('catbox-waifu');
        if(SYSTEM_CONFIG.profile.waifuImage) {
            waifuContainer.innerHTML = `<img src="${SYSTEM_CONFIG.profile.waifuImage}" alt="System Assistant">`;
        }

        // 3. Load Tags
        const tagsContainer = document.getElementById('tags-box');
        SYSTEM_CONFIG.tags.forEach(tag => { 
            tagsContainer.innerHTML += `<span class="tag">[${tag}]</span>`; 
        });

        // 4. Load Links with Hacker Effect
        const linksContainer = document.getElementById('links-box');
        SYSTEM_CONFIG.links.forEach(link => {
            const a = document.createElement('a');
            a.href = link.url; 
            a.className = 'cyber-btn'; 
            a.target = '_blank';
            a.innerHTML = `<span class="hacker-text" data-value="${link.label}">${link.label}</span> <span>➜</span>`;
            linksContainer.appendChild(a);

            // Hacker Text Effect on Hover
            a.addEventListener('mouseenter', event => {
                const target = event.currentTarget.querySelector('.hacker-text');
                let it = 0;
                const iv = setInterval(() => {
                    target.innerText = target.innerText.split("").map((l, i) => {
                        if(i < it) return target.dataset.value[i];
                        return "ABCDEF12345!@#$"[Math.floor(Math.random() * 15)];
                    }).join("");
                    if(it >= target.dataset.value.length) clearInterval(iv);
                    it += 1/3;
                }, 30);
            });
        });

        /* ========================================================================
           AUDIO & INTERACTION LOGIC
           ======================================================================== */
        const audio = document.getElementById('audio-source');
        const overlay = document.getElementById('overlay');
        const playBtn = document.getElementById('play-btn');
        const trackName = document.getElementById('track-name');
        
        // Set Audio Source
        audio.src = SYSTEM_CONFIG.music.url;
        trackName.innerText = SYSTEM_CONFIG.music.name;

        // Enter Site (Unlocks Audio Context)
        overlay.addEventListener('click', () => {
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 800);
            
            // Try to play audio
            audio.play().then(() => {
                playBtn.innerText = "PAUSE";
                toggleBars(true);
            }).catch(e => {
                console.log("Auto-play blocked, waiting for manual click");
                playBtn.innerText = "PLAY";
            });
        });

        // Manual Play/Pause Button
        playBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Prevent bubbling
            if(audio.paused) { 
                audio.play(); 
                playBtn.innerText = "PAUSE"; 
                toggleBars(true);
            } else { 
                audio.pause(); 
                playBtn.innerText = "PLAY"; 
                toggleBars(false);
            }
        });

        function toggleBars(isRunning) {
            document.querySelectorAll('.bar').forEach(b => {
                b.style.animationPlayState = isRunning ? 'running' : 'paused';
            });
        }

        /* ========================================================================
           VISUAL EFFECTS (TILT & CANVAS)
           ======================================================================== */
        // 3D Tilt Effect
        const card = document.getElementById('tilt-card');
        document.addEventListener('mousemove', (e) => {
            if(window.innerWidth < 600) return; // Disable on mobile
            
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            
            // Custom Cursor Movement
            document.querySelector('.cursor-dot').style.left = e.clientX + 'px';
            document.querySelector('.cursor-dot').style.top = e.clientY + 'px';
            
            // Slight delay for the outer circle
            setTimeout(() => {
                const circle = document.querySelector('.cursor-circle');
                if(circle) {
                    circle.style.left = e.clientX + 'px';
                    circle.style.top = e.clientY + 'px';
                }
            }, 50);
        });

        // Neural Network Canvas Animation
        const canvas = document.getElementById('neural-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; 
        canvas.height = window.innerHeight;
        
        let pArr = [];
        class Part {
            constructor() {
                this.x = Math.random()*canvas.width; 
                this.y = Math.random()*canvas.height;
                this.sx = Math.random()*1.5-0.75; 
                this.sy = Math.random()*1.5-0.75;
            }
            update() {
                this.x += this.sx; 
                this.y += this.sy;
                if(this.x > canvas.width || this.x < 0) this.sx *= -1;
                if(this.y > canvas.height || this.y < 0) this.sy *= -1;
            }
            draw() { 
                ctx.fillStyle = '#00f7ff'; 
                ctx.beginPath(); 
                ctx.arc(this.x, this.y, 1, 0, Math.PI*2); 
                ctx.fill(); 
            }
        }

        function initParticles() { 
            pArr = []; 
            // Calculate particle count based on screen size
            const count = (canvas.width * canvas.height) / 9000;
            for(let i=0; i<count; i++) pArr.push(new Part()); 
        }

        function animate() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            
            pArr.forEach(p => { 
                p.update(); 
                p.draw(); 
            });

            // Draw Lines
            for(let i=0; i<pArr.length; i++) {
                for(let j=i; j<pArr.length; j++) {
                    let d = ((pArr[i].x-pArr[j].x)**2)+((pArr[i].y-pArr[j].y)**2);
                    if(d < (canvas.width/7)*(canvas.height/7)) {
                        ctx.strokeStyle = `rgba(0, 247, 255, ${1-(d/20000)})`; 
                        ctx.lineWidth = 1;
                        ctx.beginPath(); 
                        ctx.moveTo(pArr[i].x, pArr[i].y); 
                        ctx.lineTo(pArr[j].x, pArr[j].y); 
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        initParticles(); 
        animate();
        
        window.addEventListener('resize', () => { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
            initParticles(); 
        });

    </script>
</body>
</html>
